name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Syntax check
        run: |
          python3 -m py_compile scripts/usb_bench.py
          bash -n scripts/usb-benchmark.sh
